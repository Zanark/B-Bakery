<svg xmlns="http://www.w3.org/2000/svg" width="560" height="560" viewBox="0 0 560 560">
  <title>Decorative sunny arched window</title>
  <desc>An original imaginary timber window with pale amber light, cream linen, trailing leaves and a small terracotta pot. The light central space is intentionally open for separate real cake imagery. This is an illustration, not a depiction of real premises.</desc>
