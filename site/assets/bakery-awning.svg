      <path d="M50 128H100V181Q100 234 75 234Q50 234 50 181Z" fill="#f7dbe4"/>
      <path d="M0 132V181Q0 234 25 234Q50 234 50 181V132M50 181Q50 234 75 234Q100 234 100 181V132" fill="none" stroke="#a78171" stroke-width="1.2"/>
      <path d="M4 180Q4 229 25 229Q46 229 46 180M54 180Q54 229 75 229Q96 229 96 180" fill="none" stroke="#b99b88" stroke-width=".8" opacity=".6"/>
    </pattern>
    <mask id="awning-valance-mask" maskUnits="userSpaceOnUse" x="0" y="128" width="1200" height="108">
      <rect y="128" width="1200" height="108" fill="url(#awning-hanging-panels)"/>
    </mask>
  </defs>
