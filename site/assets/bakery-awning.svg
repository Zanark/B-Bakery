<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" preserveAspectRatio="none">
  <title>Decorative full-width striped bakery canopy</title>
  <desc>Original cream and blush fabric slopes from a wall-mounted green rail to a projecting front bar, with stitched stripes and an extended deep scalloped valance. The front spans the full artwork width without transparent side gutters. No reference imagery or lettering.</desc>
  <defs>
    <linearGradient id="awning-slope-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#654d3b" stop-opacity=".24"/>
      <stop offset=".15" stop-color="#654d3b" stop-opacity=".09"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".8" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#654d3b" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="awning-valance-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#654d3b" stop-opacity=".24"/>
      <stop offset=".35" stop-color="#654d3b" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="awning-rail" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#71816b"/>
      <stop offset=".3" stop-color="#415743"/>
      <stop offset="1" stop-color="#283e30"/>
    </linearGradient>
    <clipPath id="awning-slope-clip">
      <path d="M12 13H1188L1194 78Q1195 102 1200 124H0Q5 102 6 78Z"/>
    </clipPath>
    <pattern id="awning-hanging-panels" width="100" height="240" patternUnits="userSpaceOnUse">
