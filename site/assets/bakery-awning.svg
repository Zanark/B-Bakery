<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <title>Original rose-pink narrow-striped bakery canopy</title>
  <desc>40 alternating rose and cream stripes cover a longer projecting slope, filled to both side edges. Each stripe ends in one equally wide deep scallop, retaining the original hem depth. A separate static metal support layer attaches the wall rail to the front bar.</desc>
  <defs>
    <linearGradient id="awning-slope-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#654d3b" stop-opacity=".24"/><stop offset=".15" stop-color="#654d3b" stop-opacity=".09"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/><stop offset=".8" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#654d3b" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="awning-valance-shade" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#654d3b" stop-opacity=".24"/><stop offset=".35" stop-color="#654d3b" stop-opacity=".05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="awning-rail" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#71816b"/><stop offset=".3" stop-color="#415743"/><stop offset="1" stop-color="#283e30"/>
    </linearGradient>
    <clipPath id="awning-slope-clip"><rect y="13" width="1200" height="171"/></clipPath>
    <pattern id="awning-stripes" width="60" height="300" patternUnits="userSpaceOnUse">
      <rect width="30" height="300" fill="#fffaf1"/><rect x="30" width="30" height="300" fill="#ce7183"/>
    </pattern>
    <pattern id="awning-hanging-panels" width="30" height="300" patternUnits="userSpaceOnUse">
      <path d="M0 188H30V241Q30 294 15 294Q0 294 0 241Z" fill="white"/>
    </pattern>
    <mask id="awning-valance-mask" maskUnits="userSpaceOnUse" x="0" y="188" width="1200" height="108">
      <rect y="188" width="1200" height="108" fill="url(#awning-hanging-panels)"/>
    </mask>
    <pattern id="awning-hem-stitch" width="30" height="300" patternUnits="userSpaceOnUse">
      <path d="M0 192V241Q0 294 15 294Q30 294 30 241V192" fill="none" stroke="#8e5d59" stroke-width="1.2"/>
      <path d="M4 240Q4 289 15 289Q26 289 26 240" fill="none" stroke="#fffaf1" stroke-width=".8" opacity=".55"/>
    </pattern>
  </defs>
  <g id="awning-sloped-fabric" data-stripe-count="40" clip-path="url(#awning-slope-clip)">
    <rect y="13" width="1200" height="171" fill="#fffaf1"/>
    <g fill="#ce7183"><path d="M41.4 13H70.8L64.86 112.84Q60 160 60 184H30Q30 160 35.13 112.84Z"/><path d="M100.2 13H129.6L124.32 112.84Q120 160 120 184H90Q90 160 94.59 112.84Z"/><path d="M159 13H188.4L183.78 112.84Q180 160 180 184H150Q150 160 154.05 112.84Z"/><path d="M217.8 13H247.2L243.24 112.84Q240 160 240 184H210Q210 160 213.51 112.84Z"/><path d="M276.6 13H306L302.7 112.84Q300 160 300 184H270Q270 160 272.97 112.84Z"/><path d="M335.4 13H364.8L362.16 112.84Q360 160 360 184H330Q330 160 332.43 112.84Z"/><path d="M394.2 13H423.6L421.62 112.84Q420 160 420 184H390Q390 160 391.89 112.84Z"/><path d="M453 13H482.4L481.08 112.84Q480 160 480 184H450Q450 160 451.35 112.84Z"/><path d="M511.8 13H541.2L540.54 112.84Q540 160 540 184H510Q510 160 510.81 112.84Z"/><path d="M570.6 13H600L600 112.84Q600 160 600 184H570Q570 160 570.27 112.84Z"/><path d="M629.4 13H658.8L659.46 112.84Q660 160 660 184H630Q630 160 629.73 112.84Z"/><path d="M688.2 13H717.6L718.92 112.84Q720 160 720 184H690Q690 160 689.19 112.84Z"/><path d="M747 13H776.4L778.38 112.84Q780 160 780 184H750Q750 160 748.65 112.84Z"/><path d="M805.8 13H835.2L837.84 112.84Q840 160 840 184H810Q810 160 808.11 112.84Z"/><path d="M864.6 13H894L897.3 112.84Q900 160 900 184H870Q870 160 867.57 112.84Z"/><path d="M923.4 13H952.8L956.76 112.84Q960 160 960 184H930Q930 160 927.03 112.84Z"/><path d="M982.2 13H1011.6L1016.22 112.84Q1020 160 1020 184H990Q990 160 986.49 112.84Z"/><path d="M1041 13H1070.4L1075.68 112.84Q1080 160 1080 184H1050Q1050 160 1045.95 112.84Z"/><path d="M1099.8 13H1129.2L1135.14 112.84Q1140 160 1140 184H1110Q1110 160 1105.41 112.84Z"/><path d="M1158.6 13H1200L1200 112.84Q1200 160 1200 184H1170Q1170 160 1164.87 112.84Z"/></g>
