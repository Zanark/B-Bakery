h d="M1158.6 13L1164.87 112.84Q1170 160 1170 184"/></g>
    <path d="M5 170H1195" fill="none" stroke="#fffaf1" stroke-width="2" opacity=".36"/>
  </g>
  <g id="awning-hanging-valance" data-scallop-count="40" mask="url(#awning-valance-mask)">
    <rect y="188" width="1200" height="108" fill="url(#awning-stripes)"/>
    <rect y="188" width="1200" height="108" fill="url(#awning-valance-shade)"/>
    <rect y="188" width="1200" height="108" fill="url(#awning-hem-stitch)"/>
  </g>
  <g id="awning-front-bar">
    <rect y="182" width="1200" height="8" fill="#967861"/><rect y="182" width="1200" height="3" fill="#fff4df"/>
    <path d="M0 189H1200" stroke="#6b5745" stroke-width="1.2" opacity=".5"/>
  </g>
  <g id="awning-wall-rail">
    <rect width="1200" height="16" fill="url(#awning-rail)"/>
    <path d="M0 3H1200" stroke="#b3bc9d" stroke-width="1.5" opacity=".65"/><path d="M0 15H1200" stroke="#263b2b" stroke-width="2"/>
  </g>
</svg>
